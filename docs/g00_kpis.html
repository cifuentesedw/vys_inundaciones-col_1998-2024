<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPIs Emergencias Colombia 1998-2024</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: #1a2b3c;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .kpi-grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 20px;
    width: 100%;
    padding: 40px;
    justify-content: center;
  }
  .kpi-card {
    background: #f4f7fb;
    border: 1px solid #d0dde8;
    border-radius: 8px;
    padding: 28px 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 160px;
    max-width: 240px;
  }
  .kpi-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #6a8faa;
    text-transform: uppercase;
  }
  .kpi-value {
    font-size: 2.2rem;
    font-weight: 900;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Eventos</div>
      <div class="kpi-value" style="color:#d4860b;">17,687</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Fallecidos</div>
      <div class="kpi-value" style="color:#c0392b;">10,470</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Personas Afectadas</div>
      <div class="kpi-value" style="color:#1a9e6e;">153,216,090</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Viviendas Afectadas</div>
      <div class="kpi-value" style="color:#1e6fa5;">11,982,190</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Dptos. Afectados</div>
      <div class="kpi-value" style="color:#7c5cbf;">46</div>
    </div>
  </div>
</body>
</html>
