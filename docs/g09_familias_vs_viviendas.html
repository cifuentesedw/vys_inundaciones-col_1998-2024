<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Familias vs Viviendas Afectadas</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #020b12;
    color: #d4e9f7;
    height: 100vh;
    overflow: hidden;
  }

  .chart-wrapper {
    background: #07111a;
    border: 1px solid #0e2233;
    border-radius: 6px;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
  }

  .chart-wrapper > div {
    width: 100% !important;
    height: 100% !important;
    min-height: unset !important;
  }
</style>
</head>

<body>

<div class="chart-wrapper">
  <div id="chart"></div>
</div>

<script>
Plotly.newPlot(
  "chart",
  [
    {
      hovertemplate:
        "<b>%{text}</b><br>Familias afectadas: %{x:,}<br>Viviendas afectadas: %{y:,}<extra></extra>",
      marker: {
        color: [200,600,140,50,60,2470,240,450,240,730,340,20,540,450,300,60,190,120,430,70,310,370],
        colorscale: [
          [0, "#0a3a5c"],
          [0.5, "#e63946"],
          [1.0, "#f5c518"]
        ],
        colorbar: {
          len: 0.6,
          thickness: 14,
          tickfont: { color: "#d4e9f7", size: 10 },
          title: { text: "Fallecidos", font: { color: "#d4e9f7", size: 11 } }
        },
        line: { color: "#0f1923", width: 1 },
        opacity: 0.85,
        size: [
          90,83.47,60.07,48.28,43.49,42.65,40.77,31.24,30.31,29.26,
          28.97,28.23,27.10,25.61,23.39,19.47,18.62,18.08,17.83,17.44,
          17.39,17.27
        ]
      },
      mode: "markers+text",
      showlegend: false,
      text: [
        "Bolívar","Chocó","Magdalena","Córdoba","Sucre","Antioquia","Cesar",
        "Cauca","La Guajira","Santander","Putumayo","Choco","Nariño",
        "Valle Del Cauca","Atlántico","Arauca","Boyacá","Casanare","Meta",
        "Bolivar","Norte De Santander","Tolima"
      ],
      textfont: { color: "#d4e9f7", size: 9 },
      textposition: "top center",
      x: [
        4436910,4185250,2745620,2183260,1918320,1944610,1668110,1337270,
        1247350,1090430,1098010,1382430,1039280,878660,749960,611860,
        459430,459350,504270,776520,426980,403610
      ],
      y: [
        729390,1069570,1055590,674320,624750,777740,531400,399050,437020,
        492690,240010,506140,467920,454320,445400,158320,197630,174750,
        217140,291890,264660,221130
      ],
      type: "scatter"
    }
  ],
  {
    font: { color: "#d4e9f7", size: 12, family: "'Segoe UI', Arial, sans-serif" },
    margin: { l: 60, r: 90, t: 80, b: 60 },
    xaxis: {
      title: { text: "Total Familias Afectadas" },
      gridcolor: "#0e2233",
      zerolinecolor: "#0e2233"
    },
    yaxis: {
      title: { text: "Total Viviendas Afectadas" },
      gridcolor: "#0e2233",
      zerolinecolor: "#0e2233"
    },
    title: {
      text:
        "🫧 Familias vs Viviendas Afectadas por Departamento<br><sup>Tamaño = personas afectadas · Color = fallecidos</sup>",
      font: { color: "#ffffff", size: 15 },
      x: 0.05
    },
    paper_bgcolor: "#07111a",
    plot_bgcolor: "#050d14"
  },
  {
    responsive: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ["select2d", "lasso2d"],
    displaylogo: false
  }
);
</script>

</body>
</html>
