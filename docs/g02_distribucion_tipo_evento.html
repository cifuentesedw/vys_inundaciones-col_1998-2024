<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución por Tipo de Evento</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #020b12;
    color: #d4e9f7;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  .chart-wrapper {
    width: 100%;
    height: 100%;
    background: #07111a;
    border: 1px solid #0e2233;
    border-radius: 6px;
    overflow: hidden !important;
  }

  .chart-wrapper > div {
    width: 100% !important;
    height: 100% !important;
    min-height: unset !important;
  }
</style>
</head>

<body>

<div class="chart-wrapper">
  <div id="chart"></div>
</div>

<script>
Plotly.newPlot(
  "chart",
  [
    {
      hole: 0.45,
      type: "pie",
      labels: ["INUNDACIÓN", "CRECIENTE SÚBITA", "TEMPORAL", "AVENIDA TORRENCIAL"],
      values: [15315, 1417, 480, 475],
      hovertemplate: "EVENTO=%{label}<br>n=%{value}<extra></extra>",
      marker: {
        colors: ["#f5c518", "#e63946", "#00e5a0", "#3a9eca"],
        line: { color: "#0f1923", width: 1 }
      },
      textfont: { color: "#d4e9f7" }
    }
  ],
  {
    title: {
      text: "🔵 Distribución por Tipo de Evento (Top 10)",
      font: { color: "#ffffff", size: 16 },
      x: 0.05
    },
    paper_bgcolor: "#07111a",
    plot_bgcolor: "#050d14",
    margin: { l: 20, r: 20, t: 70, b: 20 },
    font: { color: "#d4e9f7", family: "'Inter', Arial" },
    showlegend: true,
    legend: {
      font: { color: "#d4e9f7" }
    }
  },
  {
    responsive: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ["select2d", "lasso2d"],
    displaylogo: false
  }
);
</script>

</body>
</html>
