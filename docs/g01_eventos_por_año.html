<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos por Año</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: #020b12;
    color: #d4e9f7;
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  .chart-wrapper {
    width: 100%;
    height: 100%;
    background: #07111a;
    border: 1px solid #0e2233;
    border-radius: 6px;
    overflow: hidden !important;
  }

  .chart-wrapper > div {
    width: 100% !important;
    height: 100% !important;
    min-height: unset !important;
  }
</style>
</head>

<body>

<div class="chart-wrapper">
  <div id="chart"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var data = [{
    x: [1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024],
    y: [323,666,307,104,220,275,416,571,530,619,1090,441,197,1683,1276,687,492,279,643,796,582,501,810,1283,1452,666,778],
    type: "scatter",
    mode: "lines",
    line: { color: "#f5c518", width: 2.5 },
    fill: "tozeroy",
    fillcolor: "rgba(245,197,24,0.15)"
  }];

  var layout = {
    paper_bgcolor: "#07111a",
    plot_bgcolor: "#050d14",
    font: { color: "#d4e9f7", family: "Inter, Arial, sans-serif" },

    xaxis: {
      title: "AÑO",
      showgrid: false,
      zeroline: false,
      tickfont: { color: "#d4e9f7" },
      linecolor: "#d4e9f7"
    },

    yaxis: {
      title: "eventos",
      showgrid: false,
      zeroline: false,
      tickfont: { color: "#d4e9f7" },
      linecolor: "#d4e9f7"
    },

    margin: { l: 50, r: 20, t: 40, b: 40 },

    title: {
      text: "📈 Eventos Registrados por Año (1998–2024)",
      font: { color: "#ffffff", size: 15 }
    }
  };

  Plotly.newPlot("chart", data, layout, {
    responsive: true,
    displayModeBar: true,
    modeBarButtonsToRemove: ["select2d", "lasso2d"],
    displaylogo: false
  });

  // Limpieza total de líneas y grids
  Plotly.relayout("chart", {
    "xaxis.showgrid": false,
    "xaxis.zeroline": false,
    "yaxis.showgrid": false,
    "yaxis.zeroline": false
  });

});
</script>

</body>
</html>
